<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BookLeaf Publishing — Author Support & Communication Portal</title>
  <!-- Tailwind CSS CDN for instant, pristine, responsive UI -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
          colors: {
            brand: {
              50: '#f0fdf4',
              100: '#dcfce7',
              500: '#22c55e',
              600: '#16a34a',
              700: '#15803d',
              900: '#14532d',
            }
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .badge-critical { @apply bg-red-100 text-red-800 border border-red-200; }
    .badge-high { @apply bg-amber-100 text-amber-800 border border-amber-200; }
    .badge-medium { @apply bg-blue-100 text-blue-800 border border-blue-200; }
    .badge-low { @apply bg-slate-100 text-slate-800 border border-slate-200; }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col">

  <!-- Top Navigation Header -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3 cursor-pointer" onclick="navigateHome()">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-emerald-600 to-teal-500 flex items-center justify-center text-white font-black text-xl shadow-md shadow-emerald-500/20">
          B
        </div>
        <div>
          <span class="font-extrabold text-lg tracking-tight text-slate-900">BookLeaf</span>
          <span class="text-xs px-2 py-0.5 rounded-full bg-emerald-50 text-emerald-700 font-semibold border border-emerald-200 ml-1">Support Portal</span>
        </div>
      </div>

      <!-- Quick Session Indicator / Navigation -->
      <div id="header-auth" class="flex items-center space-x-3">
        <!-- Rendered by JS -->
      </div>
    </div>
  </header>

  <!-- Live Real-Time Banner (Notification pill) -->
  <div id="realtime-toast" class="hidden fixed bottom-6 right-6 z-50 max-w-md bg-slate-900 text-white px-4 py-3 rounded-2xl shadow-2xl flex items-center space-x-3 border border-slate-700 animate-bounce">
    <span class="flex h-3 w-3 relative">
      <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
      <span class="relative inline-flex rounded-full h-3 w-3 bg-emerald-500"></span>
    </span>
    <p id="realtime-toast-msg" class="text-sm font-medium"></p>
  </div>

  <!-- Main Content Container -->
  <main id="app" class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <!-- Dynamic Views will mount here -->
  </main>

  <!-- Global Footer -->
  <footer class="bg-white border-t border-slate-200 py-6 mt-12 text-center text-xs text-slate-500">
    <div class="max-w-7xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-4">
      <p>© 2026 BookLeaf Publishing. Built by <strong>Divyansh Joshi</strong> for Technical Evaluation.</p>
      <div class="flex items-center space-x-4 text-slate-400">
        <span>Protected by Candidate Evaluation License</span>
        <span>•</span>
        <span>Status: <span class="text-emerald-600 font-semibold">Active Node Engine</span></span>
      </div>
    </div>
  </footer>

  <script src="/app.js"></script>
</body>
</html>
